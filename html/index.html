     drawn as one scroll.
     act i · nested: seven rings accrete — brain, person, team, business unit,
     corporation, industry, nation — while the camera pulls back.
     act ii · the side view: the camera tips a quarter-turn and the same rings
     become a stack, brain at the bottom, nation at the top, each level named.
     act iii · the first attractor, catastrophe: at every level one part swells red
     and grows while its neighbours crumble and fall off the structure.
     act iv · the second attractor, dystopia: an ash-blue cage of bars closes over
     the stack, a pale beam scans it top to bottom, every part snaps to its slot
     and pulses in lockstep. the orbits freeze.
     act v · the third attractor: the cage lifts — gold beads climb the stack in a
     helix through every level, warm light pools at every ring, colour and motion
     return.
     act vi · back in the big view: entropy — nothing is fed, everything greys and
     drifts apart. extropy — one white-hot centre drags everything inward and eats
     the flow. syntropy — energy flows through every ring and the order
     holds, warm.
     the finale: all of it at once — the living nest breathing gold, a red tumour
     still swelling on every ring, a few parts still locked ash — every force, every
     scale, all the time. that is where the page is left. -->

<script>
(function(){
'use strict';
const cv=document.getElementById('hv'), ctx=cv.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const mob=matchMedia('(max-width:900px),(pointer:coarse)').matches;

/* the ladder — the nest, smallest inside / lowest on the stack */
const LV=[
 {n:'the brain',         s:'86 billion neurons'},
 {n:'the person',        s:'1 human'},
 {n:'the team',          s:'~10 people'},
 {n:'the business unit', s:'~100 people'},
 {n:'the corporation',   s:'10³–10⁵ people'},
 {n:'the industry',      s:'10⁶ people'},
 {n:'the nation',        s:'10⁷–10⁹ people'}
];
const INK=['#e14fe1','#e3b31d','#4ecb66','#42a4ff','#f07f3c','#4ecb66','#42a4ff'];
const RED='#e0424f', ASH='#7d93b8', GREY='#6b746c';
/* the most pernicious catastrophe at each level — one part that grows at the
   expense of its whole. a level with no honest example gets no red dot. */
const CATA=[
 'addiction',           // the brain — one reward loop captures the whole
 'cancer',              // the person — one cell line that will not stop
 'the narcissist',      // the team — one member makes it about them
 'empire-building',     // the business unit — one team hoards budget and headcount
 'financialization',    // the corporation — one function eats the firm
 'the monopoly',        // the industry — one firm swallows the market
 'regulatory capture'   // the nation — one industry buys the referee
];
const NL=LV.length, K=1.5, R0=1;
const RW=LV.map((_,i)=>R0*Math.pow(K,i));

/* the side stack: brain at the bottom, nation at the top */
const SQY=0.30, GAPW=RW[0]*1.35;
const sH=RW.map(r=>2*r*SQY+GAPW);
const sY=[]; { let a=0; for(let i=NL-1;i>=0;i--){ sY[i]=a+sH[i]/2; a+=sH[i]; } }
const STACKH=sY[0]+sH[0]/2;

/* parts: ring i is made of 5+i parts, orbiting at the speed of its scale */
const nodes=LV.map((_,i)=>{
  const N=5+i;
  return Array.from({length:N},(_,k)=>({a0:k/N*6.2832+i*0.53, w:(0.5/Math.pow(1.55,i))*(i%2?-1:1),
    dr:Math.random()*6.2832}));
});

/* face-on sparks (accretion, extropy, syntropy, finale) */
const NS=reduced?0:(mob?22:38);
const sparks=Array.from({length:NS},()=>({u:Math.random()*(NL+1.4)-0.2,a:Math.random()*6.2832,
  v:0.35+Math.random()*0.5, w:(Math.random()<.5?-1:1)*(0.5+Math.random()*0.9), tu:0, ta:0}));
sparks.forEach(s=>{s.tu=s.u;s.ta=s.a;});
/* climbing beads for the third attractor — a helix up the stack */
const NC=reduced?0:(mob?16:28);
const climb=Array.from({length:NC},(_,k)=>({q:Math.random()*NL,a:k/NC*6.2832,
  v:0.55+Math.random()*0.4, w:1.4+Math.random()*0.8, px:0, py:0, lv:0}));
/* slag — externalities shed by the extropic column, one piece per level crossed */
const slag=[];
/* techne — the tools: one small constellation of instruments per ring */
const tek=[]; LV.forEach((_,i)=>{ const n2=3+((i*7)%3);
  for(let k=0;k<n2;k++) tek.push({i,a:Math.random()*6.2832,
    w:(Math.random()<.5?-1:1)*(0.10+Math.random()*0.14), ph:Math.random()*6.2832}); });
/* agitators — the trap's unease: a few clustered runners per ring, bumping now and then */
const agit=[]; const agRange=[];
{ let s2=0; LV.forEach((_,i)=>{ const n2=4+(i%2); agRange.push([s2,s2+n2]); s2+=n2;
  const c1=Math.random()*6.2832, c2=c1+2.6+Math.random()*1.2;
  for(let k=0;k<n2;k++){ const cc=k<Math.ceil(n2/2)?c1:c2;
    agit.push({i,a:cc+(Math.random()-0.5)*0.5,
      va:(Math.random()<.5?-1:1)*(0.12+Math.random()*0.20), ph:Math.random()*6.2832, fl:0}); } }); }

/* the five flows — what moves between the levels */
const FLOWS=[
 {c:'#e3b31d',g:'⚡',n:'energy ↑',      dir:1, lane:-2},
 {c:'#42a4ff',g:'📡',n:'information ↕', dir:0, lane:-1},
 {c:'#4ecb66',g:'📦',n:'resources ↕',   dir:0, lane:0},
 {c:'#e14fe1',g:'👑',n:'legitimacy ↑',  dir:1, lane:1},
 {c:'#f07f3c',g:'⚖️',n:'constraints ↓', dir:-1,lane:2}
];
const flb=[]; FLOWS.forEach((F,fi)=>{ for(let j=0;j<7;j++)
  flb.push({f:fi,q:Math.random()*(NL-1),d:F.dir===0?(j%2?1:-1):F.dir,v:0.45+Math.random()*0.4,wg:Math.random()*6.2832,px:0,py:0}); });
const stackYW=q=>{ if(q<=0) return sY[0]+(-q)*sH[0];
  if(q>=NL-1) return sY[NL-1]-(q-(NL-1))*sH[NL-1]*0.8;
  const lo=Math.floor(q), f=q-lo; return lerp(sY[lo],sY[lo+1],f); };

/* fireflies — the field itself is alive */
const NF=reduced?0:(mob?14:26);
const ff=Array.from({length:NF},()=>({r:0.55+Math.random()*0.85,a:Math.random()*6.2832,
  w:(Math.random()<.5?-1:1)*(0.02+Math.random()*0.05),ph:Math.random()*6.2832,
  c:Math.random()<.6?'78,203,102':'227,179,29'}));

let W=1,H=1,CX=0,CY=0,FIT=1,ZS=1,Y0=0;
function size(){
  const dpr=Math.min(2,devicePixelRatio||1);
  const w=Math.round(innerWidth*dpr), h=Math.round(innerHeight*dpr);
  if(w===W&&h===H) return;
  cv.width=W=w; cv.height=H=h;
  CX=W/2; CY=H*0.5; FIT=Math.min(W,H)*0.40;
  ZS=Math.min(W*0.42/RW[NL-1], (H*0.78)/STACKH);
  Y0=CY-STACKH*ZS/2;
}
const sm=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
const lerp=(a,b,t)=>a+(b-a)*t;
const win=(p,a,b,r)=>sm((p-a)/r)*(1-sm((p-b)/r));

/* scroll → p.
   1..7        accretion (nested)
   7.2..8.5    the side view
   8.7..10.1   catastrophe (side)
   10.3..11.7  dystopia (side)
   11.9..13.3  the third attractor (side)
   13.5..14.0  back to the big view
   14.1..15.5  entropy
   15.7..17.1  extropy
   17.3..18.7  syntropy (centropy)
   order — 7.2 the side view · 8.8 the latency ladder (overhead) ·
   10.4 the flows (side) · 12.0 catastrophe · 13.6 dystopia · 15.2 the solve ·
   16.8 entropy · 18.4 extropy · 20.0 the critique · 21.6 syntropy ·
   23.2 the trap · 24.8 the weaving · 26.8.. all of it at once */
const PMAX=32.7;
const beatsEl=document.getElementById('beats');
let p=1, pT=1;
const dystOf=q=>win(q,13.6,15.0,0.5);
function drive(){
  const r=beatsEl.getBoundingClientRect();
  const t=Math.max(0,Math.min(1,-r.top/(r.height-innerHeight)));
  pT=1+t*(PMAX-1);
  if(scrollY>40) document.documentElement.classList.add('gone');
  else document.documentElement.classList.remove('gone');
  let ai=0; RANCH.forEach((a,i)=>{ if(pT>=a-0.5) ai=i; });
  railDots.forEach((b,i)=>b.classList.toggle('on',i===ai));
}

const railDots=[...document.querySelectorAll('.rail .dot')];
const RANCH=railDots.map(b=>+b.dataset.p);
document.querySelectorAll('.rail button').forEach(b=>b.addEventListener('click',()=>{
  const r=beatsEl.getBoundingClientRect(), top=scrollY+r.top;
  const t=b.dataset.t!==undefined ? +b.dataset.t : ((+b.dataset.p)-1)/(PMAX-1);
  scrollTo({top: top+t*(r.height-innerHeight), behavior: reduced?'auto':'smooth'});
}));

function mix(h1,h2,t){
  const c1=parseInt(h1.slice(1),16), c2=parseInt(h2.slice(1),16);
  const r=Math.round(lerp(c1>>16,c2>>16,t)), g=Math.round(lerp((c1>>8)&255,(c2>>8)&255,t)),
        b=Math.round(lerp(c1&255,c2&255,t));
  return `rgb(${r},${g},${b})`;
}

/* meridians for the side view — the cage under dystopia, the weave under the third */
const MER=12;
const MERA=Array.from({length:MER},(_,m)=>m/MER*6.2832+0.13);

let __cataN=0;
function draw(now,M,dt){
  __cataN=0;
  ctx.clearRect(0,0,W,H);
  const pe=Math.min(NL,p);
  const sideW=win(p,7.2,8.5,0.5);
  const lat=win(p,8.8,10.2,0.5);
  const cha=win(p,12.0,13.4,0.5);
  const dys=dystOf(p);
  const thr=win(p,15.2,16.6,0.5);
  const ent=win(p,16.8,18.2,0.5);
  const ext=win(p,18.4,19.8,0.5);
  const crq=win(p,20.0,21.4,0.5), crqProg=sm((p-20.1)/1.1);
  const syn=win(p,21.6,23.0,0.5);
  const fin=sm((p-30.2)/0.8);
  const tilt=Math.min(1,win(p,7.2,8.6,0.6)+sm((p-10.3)/0.6)*(1-sm((p-23.1)/0.7)));
  /* appendix factors */
  const tpA=win(p,23.2,24.6,0.5), tpProg=sm((p-23.3)/0.9);
  const wA=win(p,24.8,26.3,0.55), wProg=sm((p-24.95)/1.1);
  const tec=win(p,26.5,28.0,0.55), tecProg=sm((p-26.6)/1.1);
  const ups=win(p,28.2,29.7,0.55), upsProg=sm((p-28.3)/1.1);
  const flw=win(p,10.4,11.8,0.5);
  const glowGold=Math.max(thr,syn,fin,wA*wProg,tec,ups); // when gold lays under the rings

  /* the camera */
  const zoom=FIT/(R0*Math.pow(K,Math.max(0,pe-1)));
  const breathe=i=>1+0.018*(1-dys)*(1+glowGold)*Math.sin(now*1.047+i*0.7);

  /* the field: warm → red → ash → gold → grey → white-hot → gold */
  const pool=ctx.createRadialGradient(CX,CY,0,CX,CY,FIT*1.5);
  let p0=`rgba(227,179,29,${0.05+0.05*glowGold})`;
  if(cha>0.02) p0=`rgba(224,66,79,${0.05*cha})`;
  if(dys>0.02) p0=`rgba(125,147,184,${0.045*dys})`;
  if(ent>0.02) p0=`rgba(107,116,108,${0.04*ent})`;
  if(ext>0.02) p0=`rgba(255,246,232,${0.05*ext})`;
  pool.addColorStop(0,p0); pool.addColorStop(0.5,'rgba(46,90,50,0.04)');
  pool.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=pool; ctx.fillRect(0,0,W,H);

  /* the fireflies drift; the lockdown freezes them mid-air */
  for(const F of ff){
    const x=CX+Math.cos(F.a+F.w*M)*F.r*FIT*1.15, y=CY+Math.sin(F.a+F.w*M)*F.r*FIT*0.9;
    const fa=(0.05+0.05*Math.sin(now*1.6+F.ph))*(1-dys*0.85)*(1-ent*0.5);
    if(fa<=0.005) continue;

          const du=(now*0.13+nd.dr)%1;
          ctx.beginPath();
          ctx.arc(CX+Math.cos(a)*g.rx*rad*(1+du*0.55),g.cy+Math.sin(a)*g.ry*rad*(1+du*0.55),1.2,0,6.2832);
          ctx.fillStyle=GREY; ctx.globalAlpha=ent*(1-du)*0.35; ctx.fill(); ctx.globalAlpha=1; }
        if(ext>0.02){ col=mix(INK[i],GREY,ext*0.8); na=al*(1-ext*0.65); }
        if(thr>0.02||syn>0.02){

          rr=nr*(1+0.30*wsh*wave);

           the pressure reaches it, flashes white-hot, then slides off its ring and
           spirals down into the pit. the rings visibly empty. */
        if(tpA>0.02){

          ctx.beginPath(); ctx.moveTo(xU,yU);
          ctx.quadraticCurveTo((xU+xs)/2+(CX-(xU+xs)/2)*0.3,(yU+ys)/2+(CY-(yU+ys)/2)*0.3,xs,ys);
          ctx.strokeStyle='#ff6b76'; ctx.globalAlpha=tpA*wj*0.9; ctx.lineWidth=2.2; ctx.stroke();
          ctx.globalAlpha=1;
        }
      }
    }
  }

  /* the latency ladder: one bright wave per ring, each at the speed of its scale,
     with a lap counter riding the ring's edge */
  if(lat>0.02&&tilt<0.5){
    if(!latT0) latT0=now;
    const lt=now-latT0;
    for(let i=0;i<NL;i++){ const g=G[i]; if(g.born<0.9) continue;
      const fi=0.9/Math.pow(2.3,i);
      const th=6.2832*fi*lt+i*0.9;
      const bright=mix(INK[i],'#ffffff',0.35);
      for(let q2=0;q2<24;q2++){ const a2=th-q2*0.045;
        ctx.beginPath(); ctx.arc(CX+Math.cos(a2)*g.rx,CY+Math.sin(a2)*g.ry,3.2-q2*0.11,0,6.2832);
        ctx.fillStyle=bright; ctx.globalAlpha=lat*(1-q2/24)*0.8; ctx.fill(); }
      const hx=CX+Math.cos(th)*g.rx, hy=CY+Math.sin(th)*g.ry;
      const hgl=ctx.createRadialGradient(hx,hy,0,hx,hy,12);
      hgl.addColorStop(0,'rgba(255,255,255,0.5)'); hgl.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hgl; ctx.globalAlpha=lat*0.8;
      ctx.beginPath(); ctx.arc(hx,hy,12,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
      const laps=Math.floor(fi*lt);
      const fs4=Math.max(10,Math.min(13,FIT*0.038));
      ctx.font=`700 ${fs4}px ui-monospace,"SF Mono",Menlo,monospace`;
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillStyle=INK[i]; ctx.globalAlpha=lat*0.85;
      ctx.fillText(LV[i].n+' · '+laps+'×',W*0.035,H*0.16+i*fs4*1.75);
      ctx.globalAlpha=1;
    }
  } else if(lat<=0.02) latT0=0;

  /* the weaving: anchors thread their neighbours, then gold arcs bridge the islands */
  if(wA>0.05&&tilt<0.5){
    const anch=[];
    for(let i=0;i<NL;i++){ const g=G[i]; if(g.born<0.9||g.rx<10) continue;
      const nd=nodes[i][2]; const a=nd.a0+nd.w*M;
      anch.push({x:CX+Math.cos(a)*g.rx,y:CY+Math.sin(a)*g.ry,i});
      /* threads to the ring's neighbours */
      const N=nodes[i].length;
      for(const d of [-2,-1,1,2]){
        const gth=sm((wProg*2.2-0.15-Math.abs(d)*0.14)/0.25); if(gth<=0.02) continue;
        const nb=nodes[i][(2+d+N)%N]; const ab=nb.a0+nb.w*M;
        ctx.beginPath(); ctx.moveTo(CX+Math.cos(a)*g.rx,CY+Math.sin(a)*g.ry);
        ctx.lineTo(CX+Math.cos(ab)*g.rx,CY+Math.sin(ab)*g.ry);
        ctx.strokeStyle=INK[i]; ctx.globalAlpha=wA*gth*0.45; ctx.lineWidth=1.2; ctx.stroke();
        ctx.globalAlpha=1;
      }
    }
    /* the bridges: island to island, in gold */
    for(let j=0;j<anch.length-1;j++){
      const gb=sm((wProg-0.45-j*0.06)/0.16); if(gb<=0.02) continue;
      const A=anch[j],B2=anch[j+1];
      const mx=(A.x+B2.x)/2+(CX-(A.x+B2.x)/2)*0.35, my=(A.y+B2.y)/2+(CY-(A.y+B2.y)/2)*0.35;
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(mx,my,B2.x,B2.y);
      ctx.strokeStyle='#e3b31d'; ctx.globalAlpha=wA*gb*0.6; ctx.lineWidth=1.6; ctx.stroke();
      ctx.globalAlpha=1;
      /* qi rides the finished bridge */
      if(gb>0.85&&!reduced){
        const tq=(now*0.35+j*0.41)%1, u2=1-tq;
        const qx=u2*u2*A.x+2*u2*tq*mx+tq*tq*B2.x, qy=u2*u2*A.y+2*u2*tq*my+tq*tq*B2.y;
        ctx.beginPath(); ctx.arc(qx,qy,3.6,0,6.2832);
        ctx.fillStyle='#e3b31d'; ctx.globalAlpha=wA*0.18; ctx.fill();
        ctx.beginPath(); ctx.arc(qx,qy,1.8,0,6.2832); ctx.globalAlpha=wA*0.9; ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }

  /* the flows: five lanes of traffic between the levels — the seams themselves */
  if(flw>0.05&&tilt>0.4&&!reduced){
    const fs5=Math.max(12,Math.min(16,FIT*0.05));
    for(const b of flb){
      const F=FLOWS[b.f];
      b.q+=b.d*b.v*dt;
      if(b.f===4){ if(b.q<0) b.q=NL-0.2+Math.random()*0.9; }        // constraints fall in from above
      else if(b.d>0&&b.q>NL-1){ b.q=0; }
      else if(b.d<0&&b.q<0){ b.q=NL-1; }
      const x=CX+F.lane*FIT*0.14+Math.sin(now*1.3+b.wg)*3;
      const y=Y0+stackYW(b.q)*ZS;
      let r=2.6;
      if(b.f===1){ r=b.d>0? lerp(3.4,1.5,b.q/(NL-1)) : lerp(3.4,1.5,1-b.q/(NL-1)); } // info: shrinks up, grows down
      if(b.px&&Math.abs(b.py-y)<H*0.06){
        ctx.beginPath(); ctx.moveTo(b.px,b.py); ctx.lineTo(x,y);
        ctx.strokeStyle=F.c; ctx.lineCap='round'; ctx.globalAlpha=flw*0.30;
        ctx.lineWidth=r*0.9; ctx.stroke(); ctx.globalAlpha=1;
      }
      b.px=x; b.py=y;
      ctx.beginPath(); ctx.arc(x,y,r*2.1,0,6.2832);
      ctx.fillStyle=F.c; ctx.globalAlpha=flw*0.12; ctx.fill();
      ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.globalAlpha=flw*0.85; ctx.fill();
      ctx.globalAlpha=1;
    }
    /* the lane glyphs, under the stack — each one named */
    ctx.textAlign='center'; ctx.textBaseline='top';
    const fsn=Math.max(10,Math.min(12,FIT*0.035));
    FLOWS.forEach((F,fi2)=>{ const lx2=CX+F.lane*FIT*0.14, ly2=Y0+STACKH*ZS+10;
      ctx.font=`600 ${fs5}px ui-monospace,"SF Mono",Menlo,monospace`;
      ctx.globalAlpha=flw*0.85; ctx.fillStyle=F.c; ctx.fillText(F.g,lx2,ly2);
      ctx.font=`700 ${fsn}px ui-monospace,"SF Mono",Menlo,monospace`;
      ctx.globalAlpha=flw*0.8;
      ctx.fillText(F.n,lx2,ly2+fs5*1.35+(fi2%2)*fsn*1.35); });   // staggered rows so the names never collide
    ctx.globalAlpha=1;
  }

  /* the critique: the other side of the ledger. gold gains climb the stack; rust
     exhaust sheds off every ring and falls, growing as it falls, and pools at the
     bottom — a sediment of exported costs that rises to swallow the small scales */
  if(crq>0.05&&tilt>0.4){
    if(!reduced){
      for(let si=slag.length-1;si>=0;si--){ const sp=slag[si];
        sp.age+=dt; sp.vy+=FIT*0.55*dt; sp.x+=sp.vx*dt; sp.y+=sp.vy*dt; sp.vx*=(1-dt*0.6);
        if(sp.y>sedY+4||sp.age>4){ slag.splice(si,1); continue; }
        const r=1.5+Math.min(3.5,sp.age*1.8), f2=Math.min(1,sp.age/1.6);
        ctx.beginPath(); ctx.arc(sp.x,sp.y,r*2,0,6.2832);
        ctx.fillStyle='#f07f3c'; ctx.globalAlpha=crq*0.10; ctx.fill();
        ctx.beginPath(); ctx.arc(sp.x,sp.y,r,0,6.2832);
        ctx.fillStyle=mix('#f07f3c','#7a2430',f2); ctx.globalAlpha=crq*0.75; ctx.fill();
        ctx.globalAlpha=1;
      }
    }
    const pw=G[NL-1].rx*1.25;
    const pg=ctx.createLinearGradient(0,sedY,0,H);
    pg.addColorStop(0,`rgba(122,36,48,${0.30*crq})`);
    pg.addColorStop(0.4,`rgba(60,14,22,${0.45*crq})`);
    pg.addColorStop(1,`rgba(20,4,8,${0.55*crq})`);
    ctx.fillStyle=pg;
    ctx.beginPath(); ctx.moveTo(CX-pw,H);
    for(let q4=0;q4<=40;q4++){ const t4=q4/40;
      const wx=CX-pw+t4*pw*2;
      const wy=sedY+Math.sin(t4*9+now*0.9)*4+Math.sin(t4*23-now*0.6)*2;
      ctx.lineTo(wx,wy); }
    ctx.lineTo(CX+pw,H); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    for(let q4=0;q4<=40;q4++){ const t4=q4/40;
      const wx=CX-pw+t4*pw*2;
      const wy=sedY+Math.sin(t4*9+now*0.9)*4+Math.sin(t4*23-now*0.6)*2;
      q4?ctx.lineTo(wx,wy):ctx.moveTo(wx,wy); }
    ctx.strokeStyle='#f07f3c'; ctx.globalAlpha=crq*0.35; ctx.lineWidth=1.4; ctx.stroke();
    ctx.globalAlpha=1;
    const fs7=Math.max(10,Math.min(13,FIT*0.038));
    ctx.font=`700 ${fs7}px ui-monospace,"SF Mono",Menlo,monospace`;
    ctx.textAlign='center'; ctx.lineJoin='round'; ctx.lineWidth=3.5;
    ctx.strokeStyle='rgba(5,11,6,0.9)';
    ctx.textBaseline='bottom'; ctx.globalAlpha=crq*0.9;
    ctx.strokeText('gains ↑',CX-G[NL-1].rx*0.85,G[NL-1].cy-G[NL-1].ry-8);
    ctx.fillStyle='#e3b31d';
    ctx.fillText('gains ↑',CX-G[NL-1].rx*0.85,G[NL-1].cy-G[NL-1].ry-8);
    ctx.textBaseline='top';
    ctx.strokeText('externalities ↓ · compounding',CX,Math.min(H-fs7*1.6,sedY+12));
    ctx.fillStyle='#ff9d78';
    ctx.fillText('externalities ↓ · compounding',CX,Math.min(H-fs7*1.6,sedY+12));
    ctx.globalAlpha=1;
  }

  /* techne: technology up and down the spiral, coming into right relationship.
     the tools stop drifting and dock onto an instrument rail around each ring — a
     fine dashed halo — link into a circuit lace, warm from cold alloy to gold, and
     start talking: data motes run the tethers, and a synchronised shimmer travels
     outward through every level's instruments like a handshake. */
  const tA=Math.max(tec,fin*0.7);
  if(tA>0.03&&tilt<0.5&&!reduced){
    const st=tecProg;
    const phase=(now/2.6)%1;                          // the handshake, travelling outward
    const ringPulse=i=>Math.exp(-16*Math.pow(phase-(i+0.5)/NL,2));
    /* the instrument rails: one dashed halo per ring, waking with the tools */
    for(let i=0;i<NL;i++){ const g=G[i]; if(g.born<0.9||g.rx<10) continue;
      const w6=ringPulse(i);
      const hr=g.rx*(1.15-0.045*st);
      ctx.setLineDash([2,8]); ctx.lineDashOffset=-now*6;
      ctx.beginPath(); ctx.ellipse(CX,g.cy,hr,hr*(g.ry/g.rx),0,0,6.2832);
      ctx.strokeStyle=mix('#8fa3bd','#ffdf9e',st);
      ctx.globalAlpha=tA*st*(0.22+0.45*w6*st); ctx.lineWidth=1; ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
    /* the circuit lace: neighbouring instruments on a ring link up as they settle */
    if(st>0.3){
      for(let i=0;i<NL;i++){ const g=G[i]; if(g.born<0.9||g.rx<10) continue;
        const ringT=tek.filter(T=>T.i===i);
        const hr=g.rx*(1.15-0.045*st);
        for(let j2=0;j2<ringT.length;j2++){
          const A=ringT[j2], B3=ringT[(j2+1)%ringT.length];
          const x1=CX+Math.cos(A.a)*hr, y1=g.cy+Math.sin(A.a)*hr*(g.ry/g.rx);
          const x2=CX+Math.cos(B3.a)*hr, y2=g.cy+Math.sin(B3.a)*hr*(g.ry/g.rx);
          ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
          ctx.strokeStyle='#ffdf9e'; ctx.globalAlpha=tA*(st-0.3)*0.22; ctx.lineWidth=0.8; ctx.stroke();
          ctx.globalAlpha=1;
        }
      }
    }
    for(const T of tek){ const g=G[T.i]; if(g.born<0.9||g.rx<10) continue;
      T.a+=T.w*dt*lerp(2.2,0.5,st);
      const w6=ringPulse(T.i);
      const jit=(1-st)*0.05*Math.sin(now*9+T.ph);
      const rr2=g.rx*(1.15-0.045*st)*(1+jit);
      const x=CX+Math.cos(T.a)*rr2, y=g.cy+Math.sin(T.a)*rr2*(g.ry/g.rx);
      const col=mix('#8fa3bd','#ffdf9e',st);
      /* the tether, and the conversation running along it — both ways */
      if(st>0.35){
        const xi=CX+Math.cos(T.a)*g.rx, yi=g.cy+Math.sin(T.a)*g.ry;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(xi,yi);
        ctx.strokeStyle='#e3b31d'; ctx.globalAlpha=tA*(st-0.35)*0.7; ctx.lineWidth=1; ctx.stroke();
        const f6=(now*0.55+T.ph)%1, dir6=(T.ph>3.14?f6:1-f6);
        const mx6=lerp(x,xi,dir6), my6=lerp(y,yi,dir6);
        ctx.beginPath(); ctx.arc(mx6,my6,1.5,0,6.2832);
        ctx.fillStyle='#ffdf9e'; ctx.globalAlpha=tA*(st-0.35)*1.2; ctx.fill();
        ctx.globalAlpha=1;
      }
      /* the instrument: a double diamond, glinting, swelling on the handshake */
      const sz=Math.max(2.2,Math.min(4.5,g.rx*0.03))*(1+0.5*w6*st), rot=T.a+now*lerp(1.5,0.3,st);
      const glint=Math.pow(Math.max(0,Math.sin(now*3+T.ph)),6)*st;
      if(w6*st>0.3){
        const hg2=ctx.createRadialGradient(x,y,0,x,y,sz*5);
        hg2.addColorStop(0,`rgba(255,223,158,${0.30*tA*w6*st})`); hg2.addColorStop(1,'rgba(255,223,158,0)');
        ctx.fillStyle=hg2; ctx.beginPath(); ctx.arc(x,y,sz*5,0,6.2832); ctx.fill();
      }
      ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
      ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(sz,0); ctx.lineTo(0,sz); ctx.lineTo(-sz,0); ctx.closePath();
      ctx.fillStyle=col; ctx.globalAlpha=tA*0.28; ctx.fill();
      ctx.strokeStyle=glint>0.4?'#ffffff':col; ctx.globalAlpha=tA*(0.85+0.15*glint); ctx.lineWidth=1.2; ctx.stroke();
      ctx.rotate(0.7854);
      ctx.beginPath(); ctx.moveTo(0,-sz*0.55); ctx.lineTo(sz*0.55,0); ctx.lineTo(0,sz*0.55); ctx.lineTo(-sz*0.55,0); ctx.closePath();
      ctx.strokeStyle=col; ctx.globalAlpha=tA*0.45*st; ctx.lineWidth=0.8; ctx.stroke();
      ctx.restore(); ctx.globalAlpha=1;
    }
  }

  /* the upward spiral: a reflexive growth loop. it starts at the smallest
     complexity, and each turn feeds the next — exponential radius, a white-hot
     tip, beads racing along it faster the farther out they get */
  if(ups>0.03&&tilt<0.5){
    const turns=6.2, maxR=G[NL-1].rx*1.02, rot=-now*0.10;
    const drawT=sm(upsProg*1.15);
    const spt=t5=>{ const r5=maxR*Math.exp((t5-1)*4.2);
      const a5=rot+t5*turns*6.2832;
      return [CX+Math.cos(a5)*r5, CY+Math.sin(a5)*r5]; };
    const NPT=170, nEnd=Math.max(2,Math.round(NPT*drawT));
    ctx.beginPath();
    for(let q=0;q<=nEnd;q++){ const [x5,y5]=spt(q/NPT);
      q?ctx.lineTo(x5,y5):ctx.moveTo(x5,y5); }
    ctx.strokeStyle='#e3b31d'; ctx.lineCap='round';
    ctx.globalAlpha=ups*0.12; ctx.lineWidth=8; ctx.stroke();
    ctx.globalAlpha=ups*0.8; ctx.lineWidth=1.8; ctx.stroke();
    ctx.globalAlpha=1;
    /* the tip burns */
    const [tx5,ty5]=spt(nEnd/NPT);
    const tg=ctx.createRadialGradient(tx5,ty5,0,tx5,ty5,16);
    tg.addColorStop(0,`rgba(255,246,232,${0.85*ups})`); tg.addColorStop(1,'rgba(255,246,232,0)');
    ctx.fillStyle=tg; ctx.beginPath(); ctx.arc(tx5,ty5,16,0,6.2832); ctx.fill();
    /* beads compound along the loop — same parameter speed, exponential ground speed */
    if(!reduced){
      for(let b5=0;b5<9;b5++){ const f5=((now*0.045+b5*0.111)%1)*drawT;
        const [bx5,by5]=spt(f5);
        ctx.beginPath(); ctx.arc(bx5,by5,3.2,0,6.2832);
        ctx.fillStyle='#ffdf9e'; ctx.globalAlpha=ups*0.18; ctx.fill();
        ctx.beginPath(); ctx.arc(bx5,by5,1.7,0,6.2832);
        ctx.globalAlpha=ups*0.9*(0.4+0.6*f5); ctx.fill(); ctx.globalAlpha=1;
      }
    }
  }

  /* the side view's level names, riding the right edge of the stack */
  if(tilt>0.4&&!mob){
    const nameA=Math.max(sideW,0.25*Math.max(cha,dys,thr,ent,ext,syn),0.35*flw)*tilt;
    if(nameA>0.03){
      const fs2=Math.max(10,Math.min(13,FIT*0.038));
      ctx.font=`500 ${Math.round(fs2*1.15)}px Fraunces,Georgia,serif`;
      ctx.textAlign='left'; ctx.textBaseline='middle';
      for(let i=0;i<NL;i++){ const g=G[i];
        ctx.fillStyle='#9fb3a4'; ctx.globalAlpha=nameA*0.8;
        ctx.fillText(LV[i].n,CX+G[NL-1].rx+18,g.cy); }
      ctx.globalAlpha=1;
    }
  }

  /* extropy's shaft: everything powers through the centre */
  const shft=Math.max(ext,crq);
  if(shft>0.02&&tilt>0.3){
    const bw=FIT*0.10;
    const shaft=ctx.createLinearGradient(CX-bw,0,CX+bw,0);
    shaft.addColorStop(0,'rgba(255,242,218,0)');
    shaft.addColorStop(0.5,`rgba(255,242,218,${0.15*shft})`);
    shaft.addColorStop(1,'rgba(255,242,218,0)');
    ctx.fillStyle=shaft;
    ctx.fillRect(CX-bw,Y0-H*0.02,bw*2,STACKH*ZS+H*0.04);
  }
  /* the side-view traffic: the third attractor and syntropy climb the stack in a
     helix; extropy's beads run the same climb pressed tight against the axis */
  const flowA=Math.max(thr,syn,ext,crq);
  if(flowA>0.05&&!reduced&&tilt>0.3){
    for(const c of climb){
      const xt2=Math.max(ext,crq);
      c.q+=c.v*dt*(1+xt2*1.6); if(c.q>NL) c.q-=NL;
      c.a+=c.w*dt*(1+xt2*1.2);
      const iq=Math.min(NL-1.001,c.q), lo=Math.floor(iq), f=iq-lo;
      const g1=G[lo], g2=G[Math.min(NL-1,lo+1)];
      const xtr=Math.max(ext,crq);
      const tight=lerp(0.96,0.10,xtr);   // the extropic column — the critique runs the same spiral
      const rx=lerp(g1.rx,g2.rx,f)*tight, ry=lerp(g1.ry,g2.ry,f)*tight;
      const cy=lerp(g1.cy,g2.cy,f);
      const x=CX+Math.cos(c.a)*rx, y=cy+Math.sin(c.a)*ry;
      if(c.px&&Math.abs(c.py-y)<H*0.08){
        ctx.beginPath(); ctx.moveTo(c.px,c.py); ctx.lineTo(x,y);
        ctx.strokeStyle=(ext>0.5||crq>0.5)?'#fff2da':'#e3b31d'; ctx.lineCap='round';
        ctx.globalAlpha=flowA*0.30; ctx.lineWidth=2.2; ctx.stroke(); ctx.globalAlpha=1;
      }
      c.px=x; c.py=y;
      /* the critique: each level the column crosses, it sheds a cost */
      if(crq>0.25){ const lv2=Math.floor(c.q);
        if(lv2!==c.lv){ slag.push({x,y,
          vx:(Math.cos(c.a)>=0?1:-1)*FIT*(0.10+0.10*Math.abs(Math.sin(c.a*3))),
          vy:-FIT*0.03, age:0});
          if(slag.length>60) slag.shift(); } }
      c.lv=Math.floor(c.q);
      ctx.beginPath(); ctx.arc(x,y,3.4,0,6.2832);
      ctx.fillStyle=(ext>0.5||crq>0.5)?'#fff2da':'#e3b31d'; ctx.globalAlpha=flowA*0.16; ctx.fill();
      ctx.beginPath(); ctx.arc(x,y,1.7,0,6.2832);
      ctx.globalAlpha=flowA*0.85; ctx.fill(); ctx.globalAlpha=1;
    }
  }

  /* the core: warm → fevered → cold → warm · extropy swells it white-hot */
  {
    const flick=(1-cha*0.45*(0.5+0.5*Math.sin(now*7)))*(1-tpA*0.9);
    const hot=ext;
    const coreY=G[0].cy;
    const cr=Math.max(4,RW[0]*lerp(zoom,ZS,tilt)*0.42)*(1+0.06*(1-dys)*Math.sin(now*1.047))
             *(1-0.35*dys)*flick*(1-ent*0.55)*(1+hot*0.8);
    const cold=dys>0.02;
    const c0=cold?`rgba(201,212,228,0.75)`:`rgba(255,${Math.round(231-hot*40)},${Math.round(160-hot*60)},${0.95*flick*(1-ent*0.5)})`;
    const cg=ctx.createRadialGradient(CX,coreY,0,CX,coreY,cr*3.4);
    cg.addColorStop(0,c0);
    cg.addColorStop(0.25,cold?'rgba(125,147,184,0.35)':`rgba(${Math.round(227+hot*28)},${Math.round(179-hot*30)},29,${0.5*flick*(1-ent*0.5)})`);
    cg.addColorStop(0.6,`rgba(227,179,29,${0.10*(1-dys)*(1-ent*0.6)})`); cg.addColorStop(1,'rgba(227,179,29,0)');
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(CX,coreY,cr*3.4,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(CX,coreY,cr*0.62,0,6.2832);
    ctx.fillStyle=cold?'#c9d4e4':(hot>0.4?'#fff6e8':'#ffe7a0');
    ctx.globalAlpha=1-ent*0.5; ctx.fill(); ctx.globalAlpha=1;
  }

  /* face-on sparks: accretion · extropy (eaten at the centre) · syntropy · finale */
  if(!reduced){
    const sa0=Math.max((p<7.2?1:0),ext*0.95,syn,fin,wA*sm((wProg-0.75)/0.25))*(1-tilt)*(1-ent);
    if(sa0>0.03){
      ctx.lineCap='round';
      const floor=ext>0.5? 0.6 : -0.25;
      for(const s of sparks){
        s.tu+=(s.u-s.tu)*Math.min(1,dt*6); s.ta+=(s.a-s.ta)*Math.min(1,dt*6);
        s.u-=s.v*dt*(1+ext*0.8); s.a+=s.w*dt;
        if(s.u<floor){ s.u=Math.min(pe,NL)+0.6+Math.random()*0.8; s.tu=s.u;
          s.a=Math.random()*6.2832; s.ta=s.a; }
        const uu=Math.min(s.u,pe+0.8), tt=Math.min(s.tu,pe+0.9);
        const r1=R0*Math.pow(K,Math.max(-0.4,uu-1))*zoom,
              r2=R0*Math.pow(K,Math.max(-0.4,tt-1))*zoom;
        if(r2<3) continue;
        const x1=CX+Math.cos(s.a)*r1, y1=CY+Math.sin(s.a)*r1;
        const x2=CX+Math.cos(s.ta)*r2, y2=CY+Math.sin(s.ta)*r2;
        ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x1,y1);
        ctx.strokeStyle=ext>0.4?'#fff2da':'#e3b31d'; ctx.globalAlpha=0.10*sa0; ctx.lineWidth=4; ctx.stroke();
        ctx.globalAlpha=0.6*sa0; ctx.lineWidth=1.4; ctx.stroke(); ctx.globalAlpha=1;
      }
    }
  }

  /* the vignette: the dark presses in at the edges, the scene stays lit */
  const vg=ctx.createRadialGradient(CX,CY,Math.min(W,H)*0.44,CX,CY,Math.max(W,H)*0.74);
  vg.addColorStop(0,'rgba(2,5,3,0)'); vg.addColorStop(1,'rgba(2,5,3,0.40)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  /* ---- captions: a big header floating at the top, plain words, one act at a time ---- */
  const fs=Math.max(11,Math.min(15,FIT*0.045));
  ctx.font=`600 ${fs}px ui-monospace,"SF Mono",Menlo,monospace`;
  ctx.textAlign='center';
  const hfs=Math.max(15,Math.min(22,FIT*0.064));
  const headBottom=H*0.03+hfs+fs*0.6;
  const li=Math.min(NL-1,Math.floor(p-0.001));
  const lw=sm((p-li)*2.4)*sm((li+1.25-p)*1.6)*(p<NL+0.3?1:0);
  if(lw>0.02){
    const g=G[li];
    ctx.textBaseline='bottom';
    let ly=CY-g.ry-fs*0.9;
    ly=Math.max(ly,headBottom+fs*1.8);
    ly=Math.min(ly,H-fs*1.2);
    ctx.font=`500 ${Math.round(fs*1.15)}px Fraunces,Georgia,serif`;
    ctx.fillStyle=INK[li%INK.length]; ctx.globalAlpha=lw*0.9;
    ctx.fillText(LV[li].n+' · '+LV[li].s,CX,ly);
    ctx.globalAlpha=1;
  }
  const caps=[
    {a:1-sm((p-7.0)/0.5), t:'00 · the world is nested — each ring is made of the one inside it', s:'', c:'#cfe3d4'},
    {a:sideW, t:'01 · this is a holarchy', s:'many holons inside of holons — many levels inside of levels', c:'#cfe3d4'},
    {a:cha, t:'04 · things that can go wrong, № 1 · catastrophe', s:'coordination failure happens — and that causes catastrophe', c:RED},
    {a:dys, t:'05 · things that can go wrong, № 2 · dystopia', s:'everything is caged, surveilled, and controlled by an authoritarian government', c:ASH},
    {a:thr, t:'06 · a solve is decentralized coordination', s:'avoiding both coordination failure and dystopia', c:'#4ecb66'},
    {a:ent, t:'07 · things that can go wrong, № 3 · entropy', s:'the default — things fall apart on their own', c:GREY},
    {a:ext, t:'08 · a solve for entropy is extropy', s:'import energy and turn it into order — very efficient order', c:'#f0e6d2'},
    {a:crq, t:'09 · the critique of extropy', s:'extropy creates externalities — and that exports compounding costs downward', c:'#f07f3c'},
    {a:syn*(1-fin), t:'10 · another solve for entropy is syntropy', s:'energy flowing widely — each holon becoming more whole', c:'#4ecb66'},
    {a:tpA, t:'11 · things that can go wrong, № 4 · the multipolar trap', s:'each part defects because the others might — everyone ends up worse off', c:RED},
    {a:flw, t:'03 · each level gives/receives resources', s:'energy and legitimacy only climb · constraint only falls · information runs both ways', c:'#42a4ff'},
    {a:lat, t:'02 · each level thinks at its own speed', s:'the brain laps in seconds · the nation takes years to turn once', c:'#cfe3d4'},
    {a:wA, t:'12 · a solve for the multipolar trap is weaving', s:'parts link up — a mesh network of coherence is created', c:'#4ecb66'},
    {a:tec*(1-fin), t:'13 · a solve for the multipolar trap is techne', s:'technology lives at every level of the spiral — techne is tending it well', c:'#ffdf9e'},
    {a:ups*(1-fin), t:'14 · the upward spiral', s:'self-reinforcing growth loops climb the levels — progress compounds quickly and powerfully', c:'#e3b31d'}
  ];
  let dom=-1,da=0.06;
  caps.forEach((c,i)=>{ if(c.a>da){da=c.a;dom=i;} });
  if(dom>=0){
    const c=caps[dom];
    ctx.textBaseline='top';
    ctx.font=`600 ${Math.round(hfs*1.3)}px Fraunces,Georgia,serif`;
    let ht=c.t; if(ctx.measureText(ht).width>W*0.92){
      ctx.font=`600 ${Math.max(15,Math.round(hfs*1.05))}px Fraunces,Georgia,serif`; }
    ctx.fillStyle=c.c; ctx.globalAlpha=Math.min(1,da)*0.95;
    ctx.fillText(ht,CX,H*0.03);
    ctx.font=`600 ${fs}px ui-monospace,"SF Mono",Menlo,monospace`;
    if(c.s){ ctx.font=`italic 500 ${Math.round(fs*1.2)}px Fraunces,Georgia,serif`;
      ctx.globalAlpha=Math.min(1,da)*0.66; ctx.fillStyle='#9fb3a4';
      ctx.fillText(c.s,CX,headBottom); }
    ctx.globalAlpha=1;
  }
  const dOn=fin>0.55;
  if(dOn!==__dOn){ __dOn=dOn; deeperEl.classList.toggle('on',dOn); }
  moodId=dOn?15:(dom>=0?dom:moodId);
  window.__hol={p,dom,cap:dom>=0?caps[dom].t:null,cataN:__cataN};   // qa probe, nothing more
}

const deeperEl=document.getElementById('deeper'); let __dOn=false;

let audioOn=false, ac=null, masterG=null, mlp=null, mtimer=0, mstep=0, mnext=0, nbuf=null;
/* ---- the music: a generative engine with one mood per lesson.
   each pattern gets its own key, tempo, drum pattern, filter and energy ---- */
const NOTE=m=>440*Math.pow(2,(m-69)/12);
const MAJ=[0,4,7,12], MIN=[0,3,7,12];
const chd=(r,q)=>q.map(x=>NOTE(r+x));
const prg=(roots,quals)=>roots.map((r,i)=>chd(r,quals[i]));
/* b bpm · ch chords · k kick subs · h hat subs · pg pad gain · lp filter · oc octave · g pluck gain */
const MOODS=[
 {b:104,ch:prg([57,52,54,50],[MAJ,MAJ,MIN,MAJ]),k:[0],h:[3,7],pg:1,lp:2400,oc:1,g:0.075},        // 00 nested · gentle wonder
 {b:108,ch:prg([57,52,54,50],[MAJ,MAJ,MIN,MAJ]),k:[0,4],h:[1,3,5,7],pg:1,lp:2600,oc:1,g:0.085},  // 01 holarchy · steady
 {b:120,ch:prg([52,52,52,52],[MIN,MIN,MIN,MIN]),k:[0],h:[0,2,4,6],pg:0.4,lp:2000,oc:1,g:0.07},   // 02 latency · a metronome
 {b:112,ch:prg([50,55,50,48],[MAJ,MAJ,MAJ,MAJ]),k:[0,4],h:[1,3,5,7],pg:1,lp:2800,oc:1,g:0.085},  // 03 flows · traffic
 {b:92, ch:prg([57,53,52,50],[MIN,MAJ,MIN,MIN]),k:[0,3,4],h:[7],pg:1.2,lp:1300,oc:0.5,g:0.09},   // 04 catastrophe · dark
 {b:100,ch:prg([50,46,50,46],[MIN,MAJ,MIN,MAJ]),k:[0,2,4,6],h:[1,3,5,7],pg:0.3,lp:1100,oc:0.5,g:0.08}, // 05 dystopia · rigid
 {b:112,ch:prg([48,55,57,53],[MAJ,MAJ,MIN,MAJ]),k:[0,4],h:[1,3,5,7],pg:1,lp:2600,oc:1,g:0.085},  // 06 the solve · lift
 {b:84, ch:prg([57,57,53,53],[MIN,MIN,MAJ,MAJ]),k:[],h:[3],pg:0.8,lp:900,oc:0.5,g:0.06},         // 07 entropy · sparse, fading
 {b:126,ch:prg([52,52,50,50],[MIN,MIN,MIN,MIN]),k:[0,2,4,6],h:[1,3,5,7],pg:0.5,lp:1800,oc:1,g:0.09}, // 08 extropy · driving
 {b:100,ch:prg([57,53,48,55],[MIN,MAJ,MAJ,MAJ]),k:[0,4],h:[3,7],pg:1.1,lp:1700,oc:1,g:0.08},     // 09 critique · bittersweet
 {b:112,ch:prg([57,50,54,52],[MAJ,MAJ,MIN,MAJ]),k:[0,4],h:[1,3,5,7],pg:1.4,lp:3200,oc:1,g:0.09}, // 10 syntropy · lush
 {b:96, ch:prg([59,55,52,54],[MIN,MAJ,MIN,MAJ]),k:[0,3,6],h:[1,2,5,7],pg:0.8,lp:1500,oc:0.5,g:0.085}, // 11 trap · tense
 {b:116,ch:prg([54,50,57,52],[MIN,MAJ,MAJ,MAJ]),k:[0,4],h:[1,3,5,7],pg:1.2,lp:2800,oc:1,g:0.09}, // 12 weaving · building
 {b:118,ch:prg([52,59,61,57],[MAJ,MAJ,MIN,MAJ]),k:[0,4],h:[1,3,5,7],pg:1,lp:3600,oc:2,g:0.08},   // 13 techne · crystalline
 {b:124,ch:prg([57,52,54,50],[MAJ,MAJ,MIN,MAJ]),k:[0,2,4,6],h:[1,3,5,7],pg:1.3,lp:3400,oc:2,g:0.095}, // 14 upward spiral · triumphant
 {b:112,ch:prg([57,50,54,52],[MAJ,MAJ,MIN,MAJ]),k:[0,4],h:[1,3,5,7],pg:1.5,lp:3200,oc:1,g:0.1}   // 15 all of it · full
];
let moodId=0, moodLp=0;
const MARP=[0,1,2,3,2,1,2,3];
function pluck(f,t,g){ const o=ac.createOscillator(),gn=ac.createGain();
  o.type='triangle'; o.frequency.value=f;
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0008,t+0.30);
  o.connect(gn); gn.connect(mlp); o.start(t); o.stop(t+0.32); }
function kick(t){ const o=ac.createOscillator(),gn=ac.createGain();
  o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(46,t+0.11);
  gn.gain.setValueAtTime(0.12,t); gn.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(gn); gn.connect(masterG); o.start(t); o.stop(t+0.18); }
function hat(t){ if(!nbuf){ nbuf=ac.createBuffer(1,2205,44100); const d=nbuf.getChannelData(0);
    for(let i2=0;i2<2205;i2++) d[i2]=Math.random()*2-1; }
  const src=ac.createBufferSource(); src.buffer=nbuf;
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6500;
  const gn=ac.createGain(); gn.gain.setValueAtTime(0.045,t); gn.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  src.connect(hp); hp.connect(gn); gn.connect(masterG); src.start(t); src.stop(t+0.06); }
function pad(ch,t,dur,pg){ ch.forEach((f,i2)=>{ const o=ac.createOscillator(),gn=ac.createGain();
  o.type=i2?'triangle':'sawtooth'; o.frequency.value=f/2; o.detune.value=i2*5-5;
  gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(0.026*pg,t+dur*0.3);
  gn.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(gn); gn.connect(mlp); o.start(t); o.stop(t+dur+0.05); }); }
function music(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  masterG=ac.createGain(); masterG.gain.value=0; masterG.connect(ac.destination);
  mlp=ac.createBiquadFilter(); mlp.type='lowpass'; mlp.frequency.value=2600; mlp.connect(masterG);
  masterG.gain.linearRampToValueAtTime(0.5,ac.currentTime+2);
}
function startSched(){ clearInterval(mtimer); mnext=ac.currentTime+0.12;
  mtimer=setInterval(()=>{ if(!audioOn) return;
    const MD=MOODS[Math.max(0,Math.min(MOODS.length-1,moodId))];
    const spb=60/MD.b;
    if(moodLp!==MD.lp&&mlp){ moodLp=MD.lp; mlp.frequency.setTargetAtTime(MD.lp,ac.currentTime,0.6); }
    while(mnext<ac.currentTime+0.25){
      const bar=Math.floor(mstep/8)%4, sub=mstep%8, t=mnext, ch=MD.ch[bar%MD.ch.length];
      pluck(ch[MARP[sub]%ch.length]*(sub===7?2:1)*MD.oc,t,MD.g);
      if(MD.k.indexOf(sub)>=0) kick(t);
      if(MD.h.indexOf(sub)>=0) hat(t);
      if(sub===0) pad(ch.slice(0,3),t,spb*4,MD.pg);
      mstep++; mnext+=spb/2;
    } },70); }
const abtn=document.getElementById('abtn');
abtn.addEventListener('click',()=>{
  audioOn=!audioOn;
  abtn.textContent=audioOn?'🔊 music on':'🔈 music off';
  abtn.classList.toggle('on',audioOn);
  if(audioOn){ music(); startSched(); ac.resume(); }
  else{ clearInterval(mtimer); if(ac) ac.suspend(); }
});
let raf=0,last=0,M=0,latT0=0;
function loop(nowMs){
  const now=nowMs/1000, dt=Math.min(0.05,now-(last||now)); last=now;
  p+=(pT-p)*(1-Math.pow(0.02,dt));
  M+=dt*(1-dystOf(p)*0.98);                 // the lockdown freezes the orbits
  draw(now,M,dt);
  raf=requestAnimationFrame(loop);
}

size(); drive();
addEventListener('resize',()=>{size();drive();},{passive:true});
addEventListener('scroll',drive,{passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0;}
  else if(!raf&&!reduced) raf=requestAnimationFrame(loop); });
if(reduced){ p=pT; draw(0,0,0);
  addEventListener('scroll',()=>{drive();p=pT;draw(0,0,0);},{passive:true}); }
else raf=requestAnimationFrame(loop);
})();
</script>
